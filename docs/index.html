<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharing &amp; Visibility Architect Academy - Learn Salesforce Security Architecture</title>
  <meta name="description" content="Interactive, self-paced course for the Salesforce Certified Platform Sharing and Visibility Architect exam (Plat-Arch-205): 20 phases on org-wide defaults, the role hierarchy, sharing rules, groups, queues, teams, Apex managed sharing, manual sharing, external users, object permissions, permission set groups, FLS, masking and encryption, user mode, scalability and skew, licences and testing, non-record data, the enforcement wave and the capstone." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128272;</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    /* Theme key is intentionally the same one the unified academy site uses:
       every academy lives on the same github.io origin, so one toggle should
       cover all of them. Progress uses its own private key instead - see
       KEY in assets/app.js. */
    (function() {
      var t;
      try { t = localStorage.getItem('abdo-academy-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">

    <aside class="sidebar" aria-label="Academy navigation">
      <!-- filled by app.js -->
    </aside>

    <div class="content">

      <header class="topbar">
        <i class="readbar" id="readBar" aria-hidden="true"></i>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="sidebarNav">&#9776;</button>
        <a class="brand" href="#/">
          <span class="logo">&#128272;</span>
          <span class="brand-text">
            <b>Sharing &amp; Visibility</b><small id="brandSub">Architect Academy</small>
          </span>
        </a>
        <div class="tb-search">
          <input id="topSearch" type="search" placeholder="Search phases, lessons, quizzes&hellip;  (press /)" autocomplete="off" />
          <span class="kbd">/</span>
        </div>
        <div class="tb-meter" title="Progress">
          <div class="tb-bar"><i id="topBar"></i></div>
          <span id="topPct" class="tb-pct">0%</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">&#127769;</button>
      </header>

      <main id="view"></main>

      <footer class="footer">
        <a href="https://github.com/AbdoAddouli/SF-Sharing-and-Visibility-Architect-road-map" target="_blank" rel="noopener">AbdoAddouli/SF-Sharing-and-Visibility-Architect-road-map</a>
        <span>&middot;</span>
        <span>Salesforce Certified Platform Sharing and Visibility Architect &middot; API 68.0</span>
        <span>&middot;</span>
        <span>Progress is saved in your browser</span>
      </footer>

    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="assets/curricula.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
